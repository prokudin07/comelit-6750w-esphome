name: Validate receiver
on: [push, pull_request]
permissions:
  contents: read
jobs:
  receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/run.py
      - run: pip install esphome==2026.9.0
      - run: python3 tests/build.py
