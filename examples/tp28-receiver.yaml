esphome:
  name: comelit-tp28
  friendly_name: Comelit TP28 Receiver
  min_version: 2026.9.0

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

external_components:
  - source: github://prokudin07/comelit-6750w-esphome@main
    components: [comelit_simplebus]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  - platform: esphome
logger:
  level: DEBUG

comelit_simplebus:
  rx_pin:
    number: GPIO3
    mode: INPUT
  apartment_address: 1
  ring_duration: 3s
  ring:
    name: Incoming intercom call
  on_frame:
    - lambda: |-
        ESP_LOGD("example", "Valid frame: command=%u address=%u checksum=%u",
                 command, address, checksum);
